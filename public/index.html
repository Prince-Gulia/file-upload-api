<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - File Processing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Auth -->
  <div id="login-view">
    <div class="login-box glass-card">
      <h1>file-processing</h1>

      <!-- Login form -->
      <form id="login-form">
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required autocomplete="email" placeholder="name@example.com">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password" placeholder="••••••••">
        <button type="submit" id="login-btn">Log in</button>
        <p id="login-error" class="error" hidden></p>
        <p class="auth-toggle">No account? <button type="button" id="show-signup" class="link-btn">Sign up</button></p>
      </form>

      <!-- Signup form -->
      <form id="signup-form" hidden>
        <label for="signup-email">Email</label>
        <input type="email" id="signup-email" name="email" required autocomplete="email" placeholder="name@example.com">
        <label for="signup-password">Password</label>
        <input type="password" id="signup-password" name="password" required autocomplete="new-password" placeholder="••••••••">
        <button type="submit" id="signup-btn">Sign up</button>
        <p id="signup-error" class="error" hidden></p>
        <p id="signup-success" class="success" hidden></p>
        <p class="auth-toggle">Have an account? <button type="button" id="show-login" class="link-btn">Log in</button></p>
      </form>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
