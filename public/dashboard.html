<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - File Processing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- App Dashboard -->
  <div id="app-view">
    <header class="glass-card" style="margin-bottom: 32px; border-radius: 16px;">
      <span class="header-title">file-processing</span>
      <span id="user-email" class="header-meta"></span>
      <button id="logout-btn" class="link-btn">Log out</button>
    </header>

    <main>
      <!-- Upload section -->
      <section class="section glass-card">
        <h2>Upload file</h2>
        <p class="hint">Images (JPEG, PNG, WebP) and PDFs, up to 10 MB.</p>

        <div id="drop-zone" class="drop-zone">
          <span id="drop-label">Drag a file here or click to select</span>
          <input type="file" id="file-input" accept="image/png,image/jpeg,image/webp,application/pdf" hidden>
        </div>

        <div id="selected-file" class="selected-file" hidden>
          <span id="selected-name"></span>
          <span id="selected-size"></span>
          <button id="clear-file" class="link-btn">remove</button>
        </div>

        <button id="upload-btn" disabled>Upload</button>
        <p id="upload-error" class="error" hidden></p>
        <p id="upload-success" class="success" hidden></p>
      </section>

      <!-- Jobs table -->
      <section class="section glass-card">
        <div class="section-header">
          <h2>Jobs</h2>
          <button id="refresh-btn" class="link-btn">Refresh</button>
        </div>
        <p id="jobs-error" class="error" hidden></p>
        <p id="jobs-empty" class="hint" hidden>No files uploaded yet.</p>
        <div id="jobs-table-wrap" hidden>
          <table id="jobs-table">
            <thead>
              <tr>
                <th>ID</th>
                <th>Filename</th>
                <th>Type</th>
                <th>Status</th>
                <th>Uploaded</th>
                <th>Action</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="jobs-body"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- Text Preview Modal -->
  <div id="text-modal" class="modal-overlay" hidden>
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h3 id="modal-title">Extracted PDF Text</h3>
        <button id="close-modal-btn" class="link-btn">✕ Close</button>
      </div>
      <div class="modal-body">
        <pre id="modal-text-content">Loading extracted text…</pre>
      </div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
